services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "42002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "42001:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/marketplace?sslmode=disable
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Models
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      # Cost in EUR per million tokens (update if pricing changes)
      - MISTRAL_COST_INPUT_PER_M=${MISTRAL_COST_INPUT_PER_M:-0.15}
      - MISTRAL_COST_OUTPUT_PER_M=${MISTRAL_COST_OUTPUT_PER_M:-0.60}
      - CLAUDE_COST_INPUT_PER_M=${CLAUDE_COST_INPUT_PER_M:-2.76}
      - CLAUDE_COST_OUTPUT_PER_M=${CLAUDE_COST_OUTPUT_PER_M:-13.80}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "42000:3000"
    environment:
      - API_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
