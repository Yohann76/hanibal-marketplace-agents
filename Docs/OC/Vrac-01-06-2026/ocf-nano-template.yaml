# =============================================================================
# OBJET COGNITIF — Calibre NANO (Praxème)  ·  OCF v1.0.0
# Compétence atomique terminale. Pas de composition (C6 absent).
# Validateur : oc validate --calibre nano ./fichier.oc.yaml
# Référence   : https://schema.ocf.org/v1.0.0/nano
# =============================================================================

_ocf:
  version: "1.0.0"                         # Version du format OCF [OBL]
  calibre: nano                             # nano | oc | macro [OBL]
  schema: "https://schema.ocf.org/v1.0.0/nano"


# =============================================================================
# C1 · IDENTITÉ & CADRAGE
# Qui suis-je ? À qui appartiens-je ? Quel est mon contrat ?
# =============================================================================

name: "nom_du_praxeme"                      # snake_case, unique dans namespace [OBL]
namespace: "org.domaine"                    # Fully Qualified Name [OBL]
title: "Titre lisible du praxème"           # Lisible par un humain [OBL]
version: "1.0.0"                            # SemVer [OBL]
status: experimental                        # experimental | active | deprecated | archived [OBL]
owner: "owner@organisation.fr"              # Garant humain — jamais vide [OBL]
created_at: "2026-01-15T09:00:00Z"          # ISO 8601 datetime [OBL]
review_due: "2026-11-15"                    # ISO 8601 date [OBL]

mandate:                                    # Contrat agentique — non négociable [OBL]
  allowed:
    - "analyser [objet]"                    # Verbes autorisés
    - "extraire [élément]"
  forbidden:
    - "diffuser sans validation humaine"    # Interdits absolus
    - "inventer une information absente"


# =============================================================================
# C2 · PERCEPTION & CONTEXTE
# De quoi ai-je besoin pour fonctionner ?
# =============================================================================

input:                                      # Un seul input au calibre nano [OBL]
  type: text                                # text | structured | file | oc_output [OBL]
  required: true                            # [OBL]
  pii: false                                # Contient des données personnelles [OBL]
  description: "Description de l'entrée attendue"  # [OPT]

context:
  domain: "nom_du_domaine"                  # Domaine métier [OBL]
  language: "fr-FR"                         # BCP 47 [OBL]


# =============================================================================
# C3 · RAISONNEMENT
# Comment est-ce que je pense ? Que fais-je si j'échoue ?
# =============================================================================

reasoning:
  pattern: chain_of_thought                 # chain_of_thought | react | reflection [OBL]
  strategy: |                               # 1–3 phrases décrivant le raisonnement [OBL]
    Description concise du raisonnement appliqué par ce praxème.
    Mentionner les étapes clés et les critères de décision.
  on_failure: escalate_to_human             # retry | escalate_to_human | abort [OBL]


# =============================================================================
# C4 · GARDE-FOUS
# Qu'est-ce que je ne ferai JAMAIS ? Qui peut m'arrêter ?
# =============================================================================

safeguards:
  autonomy: supervised                      # monitored | supervised | approval_required [OBL]
  non_negotiable:                           # Règles jamais désactivables [OBL — min. 1]
    - id: "GF-01"
      rule: "INTERDIT de [action critique]"
      trigger: "[condition qui déclenche ce garde-fou]"
      consequence: block                    # block | alert | log [OBL]


# =============================================================================
# C5 · SORTIES & LIVRABLES
# Que produis-je exactement ? Comment mes sorties sont-elles tracées ?
# =============================================================================

output:
  type: text                                # text | json | yaml | markdown [OBL]
  format: "string"                          # Format précis [OPT]
  traceability:
    timestamped: true                       # [OBL]
    hash_output: true                       # Hash SHA-256 de chaque sortie [OBL]


# =============================================================================
# C6 · COMPOSITION — ABSENT PAR DÉFINITION
# Un praxème ne compose pas d'autres entités.
# S'il doit composer, il est devenu un OC — migrer vers calibre oc.
# =============================================================================


# =============================================================================
# C7 · GOUVERNANCE & CYCLE DE VIE (allégée)
# Quand serai-je obsolète ? Qui me maintient ?
# =============================================================================

lifecycle:
  status: experimental                      # experimental | active | deprecated | archived [OBL]
  maintainer:
    name: "Prénom NOM"                      # [OBL]
    email: "maintainer@organisation.fr"     # [OBL]
  dates:
    deployed_at: "2026-01-15"               # ISO 8601 [OBL]
    last_reviewed_at: "2026-01-15"          # ISO 8601 [OBL]
    review_due: "2026-11-15"                # ISO 8601 [OBL]
    review_interval: "P6M"                  # ISO 8601 duration [OBL]
  changelog:
    - version: "1.0.0"
      date: "2026-01-15"
      type: major                           # breaking | major | minor | patch [OBL]
      summary: "Version initiale"           # [OBL]
